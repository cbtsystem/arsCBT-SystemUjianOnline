<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Viewport wajib untuk mobile, user-scalable=no mencegah zoom tidak sengaja -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ArS-CBT</title>
  <style>
    /* Reset default browser */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      /* Fallback untuk browser lama */
      height: 100vh; 
      /* Dynamic Viewport Height: Kunci agar tidak terpotong bilah browser HP */
      height: 100dvh; 
      overflow: hidden; /* Mencegah scrollbar ganda di halaman induk */
      background-color: #ffffff;
    }
    
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      width: 100dvw; /* Dynamic Viewport Width */
      height: 100%;
      height: 100dvh; /* Menyesuaikan tinggi area yang benar-benar terlihat */
      border: none;
      display: block;
    }

    /* Opsional: Tambahan keamanan untuk HP berponi (iPhone X ke atas) */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      iframe {
        height: calc(100dvh - env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>

  <iframe 
    src="https://script.google.com/macros/s/AKfycbwylFETGnkF82DMSNYxEN26siUXAuvMchheiLigIVJsQPunM79SPNwapT9WzsYKgmew/exec"
    allow="fullscreen; camera; microphone; geolocation"
    allowfullscreen="true"
    scrolling="auto"
    title="ArdiBOSP Application">
  </iframe>

  <script>
    // Memicu fullscreen pada interaksi klik pertama (kebijakan keamanan browser modern)
    document.addEventListener('click', function() {
      const iframe = document.querySelector('iframe');
      
      if (iframe.requestFullscreen) {
        iframe.requestFullscreen().catch(err => {
          console.warn(`Fullscreen API diblokir/tidak didukung: ${err.message}`);
        });
      } else if (iframe.webkitRequestFullscreen) { /* Safari / iOS */
        iframe.webkitRequestFullscreen();
      } else if (iframe.msRequestFullscreen) { /* IE11 */
        iframe.msRequestFullscreen();
      }
    }, { once: true }); // Hanya dijalankan sekali pada klik pertama
  </script>

</body>
</html>
